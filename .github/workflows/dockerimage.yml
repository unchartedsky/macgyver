# macgyver 이미지 빌드 — master 푸시(macgyver/** 변경) 시 멀티아치 빌드해 GHCR로 푸시.
# 2023형 dockerimage.yml(무필터 푸시 트리거·복잡한 태그 스텝)을 dockers 레포 패턴으로 교체:
# sha-<단축sha>+latest 태그, 실증된 액션 버전, 명시적 permissions.
name: Dockerize

on:
  push:
    branches: [master]
    paths: ['macgyver/**', '.github/workflows/dockerimage.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/unchartedsky/macgyver

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 단축 sha 계산
        id: shortsha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ./macgyver
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.shortsha.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
